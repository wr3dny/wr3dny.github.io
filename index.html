<!doctype html>
<html lang="pl" data-theme="latte">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="src/assets/coffee-dark-svgrepo-com.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const theme =
          saved === "latte" || saved === "espresso"
            ? saved
            : saved === "night" || saved === "cyberpunk"
              ? "espresso"
              : "latte";
        document.documentElement.dataset.theme = theme;
      } catch {
        /* The app falls back to the latte theme. */
      }
    </script>
    <title>Collectorium</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
